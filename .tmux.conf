# rebind prefix key to a
#unbind C-b
#set-option -g prefix C-a
#bind-key C-a send-prefix

set-option -sg escape-time 10
set-option -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB'
set -g allow-passthrough on
set -g set-clipboard on
set-window-option -g mode-keys vi
set-option -g default-command $SHELL
set -g history-limit 50000
set -g mouse on
set -g monitor-bell on
set -g visual-bell off

########## keybinds ##########

bind r source-file ~/.tmux.conf

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# vim keys to switch panes
bind -n M-C-h select-pane -L
bind -n M-C-j select-pane -D
bind -n M-C-k select-pane -U
bind -n M-C-l select-pane -R

bind -n C-M-n next-window
bind -n C-M-p previous-window
bind -n M-C-b previous-window

# easy way to get into scroll mode
bind -n M-Pageup copy-mode -u

# Open new panes in the current pane's directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

########## greyscale theme ##########
set -g mode-style "fg=#c0c0c0,bg=#3a3a3a"
set -g message-style "fg=#c0c0c0,bg=#3a3a3a"
set -g message-command-style "fg=#c0c0c0,bg=#3a3a3a"

set -g pane-border-style "fg=#3a3a3a"
set -g pane-active-border-style "fg=#8a8a8a"

set -g status "on"
set -g status-justify "left"
set -g status-style "fg=#c0c0c0,bg=#161616"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#161616,bg=#c0c0c0,bold] #S #[default] "
set -g status-right "#[fg=#c0c0c0,bg=#161616] #{prefix_highlight} #[fg=#c0c0c0,bg=#3a3a3a] %Y-%m-%d #[fg=#161616,bg=#c0c0c0,bold] #h "

setw -g window-status-activity-style "underscore,fg=#808080,bg=#161616"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#808080,bg=#161616"
setw -g window-status-format " #I #W #F "
setw -g window-status-current-format "#[fg=#e0e0e0,bg=#3a3a3a,bold] #I #W #F "

set -g @prefix_highlight_output_prefix "#[fg=#161616]#[bg=#e0e0e0]"
set -g @prefix_highlight_output_suffix ""
